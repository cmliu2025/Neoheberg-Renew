name: Neoheberg Renew

on:
  schedule:
    - cron: "0 2 * * 1"     # 每周一 UTC 02:00（北京时间 10:00）
  workflow_dispatch:         # 可在 Actions 页面手动触发
    inputs:
      force_renew:
        description: "忽略剩余天数，强制续期"
        type: boolean
        default: false

permissions:
  contents: write            # 保活：必要时提交一个空 commit
  actions: write             # 保活：重新启用本 workflow

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      # 代理：
      #   【账号节点】在 NEO_ACCOUNTS 里给每个账号填 node 字段（节点分享链接），
      #               renew.py 会为每个账号自动启动各自的 sing-box，这里不需要任何配置。
      #   【全局代理】给没填 node 的账号共用（可不配），二选一：
      #     NODE_LINK    节点分享链接，经 sing-box 转成本地 SOCKS5
      #     PROXY_SERVER 现成的代理地址，如 http://user:pass@host:port 或 socks5://host:port
      # 账号的节点失效 → 该账号被取消（不会直连、不会换出口）；全局代理失效 → 没填 node 的账号被取消
      - name: Setup global proxy
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
          USER_PROXY: ${{ secrets.PROXY_SERVER }}
        run: |
          if [ -n "$NODE_LINK" ]; then
            python setup_proxy.py || echo "GLOBAL_PROXY_FAILED=1" >> "$GITHUB_ENV"
          elif [ -n "$USER_PROXY" ]; then
            echo "PROXY_SERVER=$USER_PROXY" >> "$GITHUB_ENV"
            echo "使用 PROXY_SERVER secret 提供的全局代理"
          else
            echo "未配置全局代理：填了 node 的账号走各自节点，其余账号直连"
          fi

      - name: Run renew script
        id: renew
        env:
          # 单账号：沿用 NEO_USER / NEO_PASSWORD / NEO_VMID（原有配置无需改动）
          NEO_USER: ${{ secrets.NEO_USER }}
          NEO_PASSWORD: ${{ secrets.NEO_PASSWORD }}
          NEO_VMID: ${{ secrets.NEO_VMID }}
          # 多账号：新增 NEO_ACCOUNTS（JSON 数组或每行 账号|密码|vmid[|节点链接]），可与上面三项同时存在
          NEO_ACCOUNTS: ${{ secrets.NEO_ACCOUNTS }}
          FORCE_RENEW: ${{ inputs.force_renew }}
          # 可选参数（Variables 里设置，留空则用默认值）：RENEW_DAYS 默认 14，ACCOUNT_GAP 默认 30（秒）
          RENEW_DAYS: ${{ vars.RENEW_DAYS }}
          ACCOUNT_GAP: ${{ vars.ACCOUNT_GAP }}
          # Telegram 推送（可选）：Secrets 里设置 TG_BOT_TOKEN / TG_CHAT_ID
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # 推送策略（可选）：Variables 里设置 TG_NOTIFY = always(默认) / change / fail
          TG_NOTIFY: ${{ vars.TG_NOTIFY }}
        run: python renew.py

      # 启动阶段就失败（装依赖出错等）时 renew.py 来不及推送，这里兜底通知一次
      - name: Notify Telegram (failed before renew)
        if: failure() && steps.renew.outcome == 'skipped'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ] || exit 0
          curl -sS -m 20 -o /dev/null "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "text=❌ NeoHeberg 续期任务在启动阶段失败：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true

      - name: Upload debug files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: |
            *.png
            *.html
          if-no-files-found: ignore

      # 仓库保活：每次运行（无论成功失败）都把检测时间写入 last_check.txt 并提交，
      # 保证仓库每周都有新提交，避免 GitHub 在 60 天无活动后停用定时任务。
      - name: Keepalive (update last_check.txt)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "last_check: $(date -u '+%Y-%m-%d %H:%M:%S') UTC"
            echo "status: ${JOB_STATUS}"
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > last_check.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last_check.txt          # 只提交这一个文件，不会带上调试截图
          git commit -m "chore: update last_check [skip ci]"
          git pull --rebase --autostash || true
          git push || echo "push 失败（已忽略）：请检查 Settings → Actions → General → Workflow permissions 是否为 Read and write"
          gh workflow enable "${{ github.workflow }}" || true   # 额外保险，失败不影响结果
